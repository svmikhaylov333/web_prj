<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap иконки -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.0/font/bootstrap-icons.css" rel="stylesheet">


</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Левое меню -->
        <div class="col-md-2 bg-dark min-vh-100 flex-shrink-0">
<div class="d-flex flex-column h-100 flex-shrink-0 p-3 text-bg-dark" >
    <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
<!--      <svg class="bi pe-none me-2" width="40" height="32"><use xlink:href="#bootstrap"></use></svg>-->

      <span class="fs-4">В Меню</span>
    </a>
    <hr>
    <ul class="nav nav-pills flex-column mb-auto">
      <li class="nav-item">
        <a href="#" class="nav-link text-white">
         <i class="bi bi-house-door fs-3 me-2"></i>
         Главная
        </a>
      </li>
      <li>
         <a href="#" class="nav-link text-white">
         <i class="bi bi-files fs-3 me-2"></i>
          Категории
        </a>
      </li>
      <li>
        <a href="#" class="nav-link text-white">
          <i class="bi bi-basket3 fs-3 me-2"></i>
          Заказы
        </a>
      </li>
      <li>
        <a href="#" class="nav-link active" aria-current="page">
          <i class="bi bi-telephone fs-3 me-2"></i>
          Контакты
        </a>
      </li>

    </ul>
    <hr>
    <div class="dropdown">
      <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-emoji-smile me-2"></i>
        <strong>Пользователь</strong>
      </a>
      <ul class="dropdown-menu dropdown-menu-dark text-small shadow" style="">
        <li><a class="dropdown-item" href="#">Профиль</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="#">Выход</a></li>
      </ul>
    </div>
</div>
</div>
        <!-- Правая часть - карточки-->
        <main class="col-md-10 ms-sm-auto px-md-4 py-4">
            <!-- Заголовок -->
            <div class="text-center mb-5">
                <h1 class="display-4">Контакты</h1>

            </div>

        <div class="row"> <!-- Основной блок для работы с колонками -->
    <div class="col-2"></div>
    <div class="col-8"> <!-- Колонка шириной 8/12 для размещения основного контента -->
        <div class="row mt-5"> <!-- Дополнительный вложенный блок для работы с колонками -->
            <div class="col-5"> <!-- -->
                <div class="card text-bg-white">
                    <div class="card-body">
                        <form method="post" action="/">
                            <h2>Оставьте заявку</h2>
                            <div class="mb-3">
                                <label for="name" class="form-label">Имя</label>
                                <input type="text" class="form-control" id="name" name="name">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Почта</label>
                                <input type="email" class="form-control" id="email" name="email">
                            </div>

                            <div class="mb-3">
                                <label for="message" class="form-label">Сообщение</label>
                                <textarea class="form-control" id="message" name="message" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Отправить</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-7"> <!-- Колонка для отображения контактов -->
                <div class="card border-0"> <!-- Карточка для визуального отделения вложенных данных -->
                    <div class="card-body"> <!-- Тело карточки, внутри которого размещаются данные -->
                        <h2>Наши контакты</h2>
                        <div class="row">
                            <div class="col">Москва</div>
                            <div class="col-6">+7 777 777 7777</div>
                        </div>
                        <div class="row">
                            <div class="col-6">Санкт-Петербург</div>
                            <div class="col-6">+7 888 888 8888</div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <div class="col-2"></div>
</div>


        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
